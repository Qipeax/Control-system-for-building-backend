openapi: 3.0.0
info:
  title: E-commerce API
  description: API для управления пользователями и заказами
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Development server
tags:
  - name: Auth
    description: Аутентификация и регистрация
  - name: Users
    description: Операции с пользователями
  - name: Orders
    description: Операции с заказами
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации
        '409':
          description: Пользователь уже существует
  
  /auth/login:
    post:
      tags:
        - Auth
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учетные данные
  
  /users/me:
    get:
      tags:
        - Users
      summary: Получить текущий профиль
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешно получен профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Не авторизован
        '404':
          description: Пользователь не найден
    
    put:
      tags:
        - Users
      summary: Обновить текущий профиль
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Профиль успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Ошибка валидации
        '409':
          description: Email уже используется
  
  /users:
    get:
      tags:
        - Users
      summary: Получить список пользователей (только для админов)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: email
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '403':
          description: Недостаточно прав
  
  /orders:
    get:
      tags:
        - Orders
      summary: Получить список заказов
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [created, in_progress, completed, cancelled]
        - name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            default: desc
            enum: [asc, desc]
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersListResponse'
    
    post:
      tags:
        - Orders
      summary: Создать новый заказ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Ошибка валидации
  
  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Получить заказ по ID
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          description: Нет доступа к заказу
        '404':
          description: Заказ не найден
    
    put:
      tags:
        - Orders
      summary: Обновить статус заказа
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Статус заказа обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Невозможно изменить статус
    
    delete:
      tags:
        - Orders
      summary: Отменить заказ
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заказ отменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          description: Невозможно отменить заказ

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: password123
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: John Doe
    
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: password123
    
    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: newemail@example.com
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Jane Doe
    
    CreateOrderRequest:
      type: object
      required:
        - items
        - totalAmount
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - name
              - quantity
              - price
            properties:
              productId:
                type: string
                example: "prod_123"
              name:
                type: string
                example: "Ноутбук"
              quantity:
                type: integer
                minimum: 1
                example: 1
              price:
                type: number
                minimum: 0
                example: 999.99
          minItems: 1
        totalAmount:
          type: number
          minimum: 0
          example: 999.99
    
    UpdateOrderRequest:
      type: object
      properties:
        status:
          type: string
          enum: [created, in_progress, completed, cancelled]
          example: in_progress
    
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: "Email должен быть валидным"
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: "123e4567-e89b-12d3-a456-426614174000"
                    email:
                      type: string
                      example: user@example.com
                    name:
                      type: string
                      example: John Doe
                    roles:
                      type: array
                      items:
                        type: string
                      example: ["user"]
                    createdAt:
                      type: string
                      format: date-time
                token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    
    UserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
    
    UsersListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserProfileResponse/properties/data'
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                    limit:
                      type: integer
                    total:
                      type: integer
                    totalPages:
                      type: integer
    
    OrderResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    userId:
                      type: string
                      format: uuid
                    items:
                      type: array
                      items:
                        type: object
                    status:
                      type: string
                    totalAmount:
                      type: number
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
    
    OrdersListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                orders:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderResponse/properties/data/properties/order'
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                    limit:
                      type: integer
                    total:
                      type: integer
                    totalPages:
                      type: integer
    
    CancelOrderResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                message:
                  type: string
                order:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    status:
                      type: string
                    updatedAt:
                      type: string
                      format: date-time